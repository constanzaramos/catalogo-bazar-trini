<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo de lanas — El Bazar de la Trini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <img
          class="site-header__logo"
          src="../LOGO%20BAZAR%20DE%20LA%20TRINI%20BLANCO%20CIRCULAR.png"
          alt="Bazar de la Trini"
          width="72"
          height="72"
        />
        <div class="site-header__titles">
          <h1 class="site-header__title">Bazar de la Trini</h1>
          <p class="site-header__subtitle">Catálogo de lanas — Rosario</p>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="filters" aria-label="Filtrar por tipo de lana">
        <span class="filters__label">Tipo de lana</span>
        <div class="filters__chips" id="filter-chips"></div>
      </section>

      <p class="results-count" id="results-count" aria-live="polite"></p>

      <div class="grid" id="catalog-grid"></div>
    </main>

    <div
      class="modal"
      id="detail-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      hidden
    >
      <div class="modal__backdrop" data-close-modal tabindex="-1"></div>
      <div class="modal__panel">
        <button type="button" class="modal__close" data-close-modal aria-label="Cerrar">
          ×
        </button>
        <div class="modal__layout">
          <div class="modal__media">
            <img class="modal__img" id="modal-img" alt="" />
          </div>
          <div class="modal__body">
            <p class="modal__badge" id="modal-categoria"></p>
            <h2 class="modal__title" id="modal-title"></h2>
            <p class="modal__meta">
              <span id="modal-codigo"></span>
              · Color <span id="modal-color"></span>
            </p>
            <p class="modal__precio" id="modal-precio"></p>
            <h3 class="modal__section-title">Descripción</h3>
            <p class="modal__text" id="modal-descripcion"></p>
            <h3 class="modal__section-title">Detalles</h3>
            <p class="modal__text" id="modal-detalles"></p>
          </div>
        </div>
      </div>
    </div>

    <script src="data/catalogo-data.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
